<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Assistance</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
      background-color: black;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      height: 100vh;
    }

    h1 {
      text-align: center;
    }

    button {
      padding: 10px 20px;
      font-size: 20px;
      font-weight: 800;
      margin-top: 20px;
      border: none;
      border-radius: 8px;
      background: cyan;
      color: black;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #00bcd4;
      color: white;
    }

    .btn-outer {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .img {
      height: 250px;
    }

    .output {
      margin-top: 20px;
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="outer">
    <h1>AI Assistance by GAURAV DUBEY</h1>
    <div class="btn-outer">
      <img src="logo_iron...gif" alt="AI Logo" class="img" />
      <button id="Talk" onclick="handleClick()">🎤 Say Something</button>
      <div class="output" id="out">Say Something...</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
